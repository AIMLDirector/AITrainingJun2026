services:
  rag-api:
    build: .
    container_name: rag-production-api
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      CHROMA_DIR: /app/chroma_db
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      # Shared training docs; override with a project-specific folder if needed
      - ../data:/app/data:ro
      - chroma_data:/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  chroma_data:

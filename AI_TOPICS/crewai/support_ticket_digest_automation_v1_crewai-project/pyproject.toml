[project]
name = "support_ticket_digest_automation"
version = "0.1.0"
description = "support_ticket_digest_automation using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.11,<2.0.0",
]

[project.scripts]
support_ticket_digest_automation = "support_ticket_digest_automation.main:run"
run_crew = "support_ticket_digest_automation.main:run"
train = "support_ticket_digest_automation.main:train"
replay = "support_ticket_digest_automation.main:replay"
test = "support_ticket_digest_automation.main:test"
run_with_trigger = "support_ticket_digest_automation.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "bbb53be1-7c76-4d82-879e-17705e096367"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]

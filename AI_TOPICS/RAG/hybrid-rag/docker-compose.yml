services:
  hybrid-rag:
    build: .
    container_name: hybrid-rag
    ports:
      - "8501:8501"   # Streamlit
      - "8000:8000"   # FastAPI (optional)
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./.env:/app/.env
    env_file:
      - .env
    restart: unless-stopped
    # Uncomment the line below if you also want FastAPI running
    # command: >
    #   bash -c "uvicorn app:app --host 0.0.0.0 --port 8000 &
    #            streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0"